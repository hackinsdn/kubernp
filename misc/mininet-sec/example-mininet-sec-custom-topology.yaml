# Template with Mininet-Sec and a custom topology with Firewall, DMZ servers, Clients and outside network
# IPv4 Addressing schema
#  - Internal network for Org1: 198.51.100.0/24
#     - 198.51.100.0-127 is the customer/clients network
#     - 198.51.100.128-255 is the servers network
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-custom-topo-${pod_hash}
data:
  customTopology.yaml: |-
    name: Example topology with multiple hosts and firewall
    hosts:
      firewall1:
        kind: iptables
        ip: 198.51.100.254/25
        group: OrgA
        rules_v4:
          filter:
            - :INPUT DROP
            - :OUTPUT ACCEPT
            - :FORWARD DROP
            - -A INPUT -j ACCEPT
            - -A FORWARD -j ACCEPT

      cliente1:
        ip: 198.51.100.10/25
        defaultRoute: via 198.51.100.126
        group: OrgA
       
      server1:
        ip: 198.51.100.129/25
        defaultRoute: via 198.51.100.254
        group: OrgA
        postStart:
          # start a http webserver running on port 8080 and another running on 8008
          - python3 -m http.server 8080 &
          - python3 -m http.server 8008 &
                
      outside1:
        ip: 203.0.113.1/24
        kind: k8spod
        image: hackinsdn/debian:latest
        defaultRoute: via 203.0.113.254
        group: Internet

      outside2:
        ip: 203.0.113.2/24
        defaultRoute: via 203.0.113.254
        group: Internet
        
    switches:
      switch1:
        kind: lxbr
        group: OrgA
      switch2:
        kind: lxbr
        group: Internet
        
    links:       
      - node1: firewall1
        node2: server1
        ipv4_node1: 198.51.100.254/25
        
      - node1: firewall1
        node2: switch1
        ipv4_node1: 198.51.100.126/25
        
      - node1: cliente1
        node2: switch1
        
      - node1: outside1
        node2: switch2
        
      - node1: outside2
        node2: switch2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mininet-sec-${pod_hash}
  labels:
    app: mininet-sec-${pod_hash}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mininet-sec-${pod_hash}
  template:
    metadata:
      name: mininet-sec-${pod_hash}
      labels:
        app: mininet-sec-${pod_hash}
      annotations:
        container.apparmor.security.beta.kubernetes.io/mininet-sec: unconfined
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ${allowed_nodes}
      containers:
      - name: mininet-sec
        image: hackinsdn/mininet-sec:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8050
        args: ["mnsec", "--topofile", "/customTopology.yaml"]
        env:
        - name: K8S_POD_HASH
          value: ${pod_hash}
        - name: K8S_NODE_AFFINITY
          value: ${allowed_nodes_str}
        - name: K8S_PROXY_CERT_FILE
          value: /usr/local/etc/mnsec-proxy-ca.crt
        - name: K8S_PROXY_HOST
          value: mnsec-proxy-service.hackinsdn.svc.cnacv5
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "SYS_MODULE", "SYS_ADMIN"]
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
        - name: config-custom-topo-${pod_hash}-volume
          readOnly: true
          mountPath: "/customTopology.yaml"
          subPath: "customTopology.yaml"
        - name: mnsec-proxy-ca-volume
          mountPath: /usr/local/etc/mnsec-proxy-ca.crt
          readOnly: true
          subPath: ca.crt
      volumes:
      - name: lib-modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: config-custom-topo-${pod_hash}-volume
        configMap:
          name: config-custom-topo-${pod_hash}
      - name: mnsec-proxy-ca-volume
        configMap:
          defaultMode: 0600
          name: mnsec-proxy-ca-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: mininet-sec-${pod_hash}
  labels:
    app: mininet-sec-${pod_hash}
spec:
  type: NodePort
  ports:
  - port: 8050
    targetPort: 8050
    name: http-mininet-sec
  selector:
    app: mininet-sec-${pod_hash}
