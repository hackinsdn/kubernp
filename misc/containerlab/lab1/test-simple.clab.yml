name: test_simple_clab

topology:
  nodes:
    h1:
      kind: linux
      image: ghcr.io/srl-labs/alpine
      binds:
        - configs/client.sh:/config.sh
      exec:
        - echo root:root | chpasswd
        - chmod +x /config.sh
        - ash -c '/config.sh 1'
    h2:
      kind: linux
      image: ghcr.io/srl-labs/alpine
      binds:
        - configs/client.sh:/config.sh
      exec:
        - echo root:root | chpasswd
        - chmod +x /config.sh
        - ash -c '/config.sh 2'
  links:
    # links between client1 and srl1
    - endpoints: [h1:eth1, h2:eth1]
